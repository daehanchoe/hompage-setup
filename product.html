<!-- 레퍼런스의 사일로 제외 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>신우래미콘그룹 | 공장 정보</title>

  <style>
    :root{
      --text:#111;
      --muted:#7b7b7b;
      --line:#e8e8e8;
      --card:#fff;
      --bg:#fff;
      --blue:#1f6feb;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* =========================
       헤더
    ========================== */

    .site-header {
      background: linear-gradient(to bottom, #ffffff, #f0f7fb);
      border-bottom: 1px solid #dbe3ea;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      text-decoration: none;
      color: #1a1a1a;
      display: block;
    }

    .logo-sub {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .main-nav {
      display: flex;
      gap: 28px;
    }

    .main-nav a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      font-size: 15px;
      transition: color 0.2s ease;
    }

    .main-nav a:hover {
      color: #0077b6;
    }

    /* =========================
       공장 상세 영역
    ========================== */

    .wrap{
      max-width: 980px;
      padding: 40px 28px 60px;
      margin: 0 auto;
      position: relative;
    }

    h1{
      margin: 10px 0 24px;
      font-size: 40px;
      letter-spacing: -0.5px;
    }

    .meta{
      display: grid;
      gap: 12px;
      margin-bottom: 30px;
    }

    .row{
      display:flex;
      align-items: baseline;
      gap: 18px;
      font-size: 22px;
    }

    .label{
      min-width: 54px;
      font-weight: 800;
    }

    .value{
      color: var(--muted);
      font-weight: 700;
    }

    .cards{
      display:flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 18px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 24px 28px;
      display:flex;
      align-items:center;
      gap: 22px;
      min-height: 120px;
    }

    .icon{
      width: 74px;
      height: 74px;
      display:grid;
      place-items:center;
      flex: 0 0 74px;
    }

    .title{
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .sub{
      font-size: 22px;
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 768px){

      .header-inner{
        flex-direction: column;
        align-items: flex-start;
      }

      .main-nav{
        gap:16px;
        flex-wrap:wrap;
      }

      h1{ font-size: 30px; }

      .row{ font-size: 18px; }

      .title{ font-size: 22px; }

      .sub{ font-size: 18px; }
    }

  </style>
</head>

<body>

  <!-- =========================
       헤더
  ========================== -->

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <a href="./index.html" class="logo-text">신우래미콘그룹</a>
        <div class="logo-sub">건설자재·제조·공급 기업그룹</div>
      </div>

      <nav class="main-nav">
        <a href="./philosophy.html">경영이념</a>
        <a href="./year.html">연혁</a>
        <a href="./product.html">제품정보</a>
        <a href="./recruit.html">채용안내</a>
        <a href="./ceo.html">CEO 소개</a>
        <a href="./index.html#sites">사업소안내</a>
        <a href="./index.html#services">주요사업</a>
        <a href="./index.html#contact">고객지원</a>
      </nav>
    </div>
  </header>

  <!-- =========================
       공장 정보
  ========================== -->

  <div class="wrap">

    <h1>울산공장(동양)</h1>

    <div class="meta">
      <div class="row">
        <div class="label">주소</div>
        <div class="value">울산 울주군 웅촌면 웅촌로 607-31</div>
      </div>
      <div class="row">
        <div class="label">전화</div>
        <div class="value">052-249-0752</div>
      </div>
      <div class="row">
        <div class="label">팩스</div>
        <div class="value">052-249-0757</div>
      </div>
    </div>

    <div class="cards">

      <!-- 배치플랜트 -->
      <div class="card">
        <div class="icon">
          <svg width="66" height="66" viewBox="0 0 66 66" fill="none">
            <path d="M10 48h44" stroke="#111" stroke-width="2"/>
            <path d="M14 48V30l10 6v-8l10 6v-8l10 6v16" stroke="#111" stroke-width="2"/>
            <path d="M46 22v-6h6v18" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <div class="title">배치플랜트</div>
          <div class="sub">300 150m³/hr×2</div>
        </div>
      </div>

      <!-- 믹서트럭 -->
      <div class="card">
        <div class="icon">
          <svg width="66" height="66" viewBox="0 0 66 66" fill="none">
            <path d="M16 40h25l6 6h7" stroke="#111" stroke-width="2"/>
            <path d="M41 40V26h8l5 8v12" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <div class="title">믹서트럭</div>
          <div class="sub">13대</div>
        </div>
      </div>

      <!-- 시멘트사일로 -->
      <div class="card">
        <div class="icon">
          <svg width="66" height="66" viewBox="0 0 66 66" fill="none">
            <path d="M20 50V20c0-4 3-7 7-7h12c4 0 7 3 7 7v30" stroke="#111" stroke-width="2"/>
            <path d="M16 50h34" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <div class="title">시멘트사일로</div>
          <div class="sub">500(TON)</div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
